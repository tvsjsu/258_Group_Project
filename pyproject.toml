[project]
name = "function-calling-finetuning"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch==2.11.0",
    "transformers>=4.45,<5",
    "datasets>=2.20,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
